<ul reversed class="posts-list">
  <cc-for each="post in postslist | reverse">
    <li class="postlist-item">
      <article>
        <h2><a href="{{ post.url | url }}">{{ post.data.title }}</a></h2>
        <cc-if cond="post.data.excerpt and showExcerpt">
          <p class="excerpt">
            <time>{{ post.date | niceShortDate }}</time> –
            {{ post.data.excerpt | toHTML | safe }}
          </p>
        </cc-if>
      </article>
    </li>
  </cc-for>
</ul>
