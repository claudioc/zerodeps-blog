<!doctype html>
<html lang="{{ language or metadata.language or 'en' }}">
<zd-include src="head.html" />

<body>
  <a class="skip-to-content" href="#main">Skip to main content</a>
  <div id="root">
    <header role="banner">
      <h1>
        <a href="{{ '/' | url }}" title="Homepage">
          <img width="60" height="60" alt="Avatar of {{ metadata.author.name }}, the author of this website"
            src="{{ metadata.author.avatar }}">
          <span>
            <span class="my-name">{{ metadata.title }}</span>
            <span>{{ metadata.subtitle }}</span>
          </span>
        </a>
      </h1>
      <nav role="navigation">
        <ul>
          <zd-for each="entry in metadata.navigation">
            <li>
              <zd-if cond="entry.url == page.url"><a class="nav-item-active" href="{{ entry.url | url }}">{{ entry.title }}</a></zd-if>
              <zd-if cond="entry.url != page.url"><a href="{{ entry.url | url }}">{{ entry.title }}</a></zd-if>
            </li>
          </zd-for>
        </ul>
      </nav>
    </header>

    <main id="main" role="main">
      {{ content | safe }}
    </main>

    <footer role="contentinfo">
      <p>
        All content © {{ thisYear }} by <a href="{{ '/about/' | url }}">{{ metadata.author.name }}</a>
        <zd-if cond="metadata.license">
          and licensed under <a href="{{ metadata.license.url }}" rel="license noopener noreferrer">{{
            metadata.license.name }}</a>
        </zd-if>
      </p>
      <zd-if cond="metadata.social.length">
        <p>
          Follow me on
          <zd-for each="item in metadata.social">
            <a rel="me" href="{{ item.url }}">{{ item.name }}</a>
          </zd-for>
        </p>
      </zd-if>
    </footer>
  </div>
</body>

</html>
