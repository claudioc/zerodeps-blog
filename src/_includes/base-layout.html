<!doctype html>
<html lang="{{ language or 'en'}}">
<cc-include src="head.html"></cc-include>

<body>
  <a class="skip-to-content" href="#main">Skip to main content</a>
  <div id="root">
    <header role="banner">
      <h1>
        <a href="{{ '/' | url }}" title="Homepage">
          <img width="60" height="60" alt="Avatar of {{ metadata.author.name }}, the author of this website"
            src="{{ metadata.author.avatar }}">
          <span>
            <span class="my-name">{{ metadata.title }}</span>
            <span>{{ metadata.subtitle }}<span>
              </span>
        </a>
      </h1>
      <nav role="navigation">
        <ul>
          <cc-for each="entry in metadata.navigation">
            <li class="nav-item{{ entry.url == page.url ? ' nav-item-active' : '' }}"><a
                href="{{ entry.url | url }}">{{ entry.title }}</a></li>
          </cc-for>
        </ul>
      </nav>
    </header>

    <main id="main" role="main">
      {{ content | safe }}
    </main>

    <footer role="contentinfo">
      <p>
        All content © {{ thisYear }} by <a href="{{ '/about/' | url }}">{{ metadata.author.name }}</a>
        <cc-if cond="metadata.license">
          and licensed under <a href="{{ metadata.license.url }}" rel="license noopener noreferrer">{{ metadata.license.name }}</a>
        </cc-if>
      </p>
      <cc-if cond="metadata.social.length">
        <p>
          Follow me on
          <cc-for each="item in metadata.social">
            <a rel="me" href="{{ item.url }}">{{ item.name }}</a>
          </cc-for>
        </p>
      </cc-if>
    </footer>
  </div>
</body>
<script>
  window.onload = function () {
    document.documentElement.classList.remove('loading');
  }
</script>

</html>
