<!doctype html>
<html lang="{{ language or 'en'}}">
<cc-include src="head.html" title="metadata.title" styles="'links.css'" links="true"></cc-include>

<body>
  <main id="main" role="main">
    {{ content | safe }}
  </main>
</body>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r134/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/vanta@latest/dist/vanta.fog.min.js"></script>
<script>
  window.onload = function () {
    document.documentElement.classList.remove('loading');
    VANTA.FOG({
      el: "body",
      mouseControls: true,
      touchControls: true,
      gyroControls: false,
      minHeight: 200.00,
      minWidth: 200.00,
      blurFactor: 0.56,
      speed: 0.60,
      zoom: 0.80,
      highlightColor: 0xb6b1ae,
      midtoneColor: 0x46413e,
      lowlightColor: 0x2f2f3c,
      baseColor: 0x221d1d,
    })
  }
</script>

</html>
