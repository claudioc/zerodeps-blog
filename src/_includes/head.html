<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="max-snippet:-1, max-image-preview: large, max-video-preview: -1">
  <title>{{ title or metadata.title }}</title>
  <link rel="shortcut icon" href="/assets/favicon.ico" type="image/x-icon">
  <link rel="icon" href="/assets/favicon.ico" type="image/x-icon">
  <meta name="author" content="{{ metadata.author.name }}">
  <meta name="description" content="{{ description or title or metadata.title }}">
  <meta name="generator" content="{{ generator }}">
  <meta property="og:type" content="website">
  <meta property="og:title" content="{{ title or metadata.title }}">
  <meta property="og:description" content="{{ description or title or metadata.title }}">
  <meta name="twitter:card" content="summary_large_image">
  <zd-if cond="image">
    <meta property="og:image" content="{{ image | absoluteUrl(metadata.url) }}">
    <meta property="twitter:image" content="{{ image | absoluteUrl(metadata.url) }}">
  </zd-if>
  <zd-if cond="image and image_alt">
    <meta property="og:image:alt" content="{{ image_alt }}">
    <meta property="twitter:image:alt" content="{{ image_alt }}">
  </zd-if>
  <link rel="canonical" href="{{ metadata.url }}{{ canonicalUrl or page.url }}">
  <link rel="alternate" href="{{ metadata.feed.path | url }}" type="application/atom+xml" title="{{ metadata.title }}">
  <meta name="referrer" content="no-referrer-when-downgrade">
  <link rel="preconnect" href="/" crossorigin>
  <link href="{{ ('/css/' + (styles or 'main.css')) | cacheBust }}" rel="stylesheet">
</head>
